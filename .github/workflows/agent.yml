name: Portfolio agent

# Finds new repositories and commits, then opens ONE pull request with the proposed changes.
# Nothing reaches the live site until you merge that pull request.
#
# On/off switch: repository variable AUTOMATION_ENABLED = true (Settings > Secrets and variables > Actions > Variables).
# Manual runs always work, and default to a dry run that changes nothing.

on:
  schedule:
    - cron: "17 6 * * *"      # daily, 06:17 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview only: analyze and print, but change nothing and open no pull request"
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: portfolio-agent
  cancel-in-progress: false

jobs:
  update:
    if: github.event_name == 'workflow_dispatch' || vars.AUTOMATION_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BRANCH: agent/auto-update
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Skip scheduled runs while a pull request is waiting for review
        id: pending
        run: |
          open=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number')
          if [ -n "$open" ] && [ "${{ github.event_name }}" = "schedule" ]; then
            echo "Pull request #$open is still open. Skipping until it is merged or closed."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.pending.outputs.skip != 'true'
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-python@v5
        if: steps.pending.outputs.skip != 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agent/requirements.txt

      - name: Install
        if: steps.pending.outputs.skip != 'true'
        run: |
          npm ci
          pip install -r agent/requirements.txt

      - name: Self-test the agent
        if: steps.pending.outputs.skip != 'true'
        run: python -m pytest agent/tests -q

      - name: Run the agent
        if: steps.pending.outputs.skip != 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            python -m agent.pipeline run --dry-run
          else
            python -m agent.pipeline run
          fi

      - name: Validate and build the result
        if: steps.pending.outputs.skip != 'true' && env.DRY_RUN != 'true'
        run: npm run check

      - name: Open or update the pull request
        if: steps.pending.outputs.skip != 'true' && env.DRY_RUN != 'true'
        run: |
          if git diff --quiet -- src/data/projects.json agent/settings.json; then
            echo "No changes to propose."
            exit 0
          fi
          git config user.name "portfolio-agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add src/data/projects.json agent/settings.json
          git commit -m "Update portfolio from GitHub activity"
          git push --force origin "$BRANCH"
          existing=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh pr edit "$existing" --body-file agent/out/pr-body.md
          else
            gh pr create --base main --head "$BRANCH" --title "Portfolio update" --body-file agent/out/pr-body.md
          fi

      - name: Save the run report
        if: always() && steps.pending.outputs.skip != 'true'
        run: |
          if [ -f agent/out/pr-body.md ]; then cat agent/out/pr-body.md >> "$GITHUB_STEP_SUMMARY"; fi
